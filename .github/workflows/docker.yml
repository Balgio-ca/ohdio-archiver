name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construire pour le test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ohdio-archiver:test

      - name: Test rapide
        run: |
          mkdir -p archive config && sudo chown 1000:1000 archive config
          docker run --rm --user 1000:1000 -v "$PWD/archive:/archive" -v "$PWD/config:/config" ohdio-archiver:test catalog
          test -f config/config.toml
          docker run --rm --entrypoint sh ohdio-archiver:test -c "ffmpeg -version | head -1 && python3 -c 'import web'"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/balgio-ca/ohdio-archiver:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Balgio-ca/ohdio-archiver
            org.opencontainers.image.description=Archive personnelle des livres audio OHdio
            org.opencontainers.image.licenses=MIT
