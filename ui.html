<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive yottio</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
  --accent: #c2410c; --accent-soft: #fff1e8; --ok: #15803d; --ok-soft: #e8f6ec;
  --warn: #b45309; --warn-soft: #fdf3e2; --off: #9a9893; --off-soft: #efeee9;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151514; --panel: #1f1f1d; --text: #ecebe7; --muted: #9c9a94; --line: #32312e;
    --accent: #fb923c; --accent-soft: #3a2517; --ok: #4ade80; --ok-soft: #173024;
    --warn: #fbbf24; --warn-soft: #3a2f14; --off: #7b7a75; --off-soft: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; margin-right: auto; letter-spacing: -0.01em; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.small { padding: 4px 9px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
input[type=search], input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.pill { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--off-soft); color: var(--muted); }
.pill.run { background: var(--accent-soft); color: var(--accent); }
.progress { display: none; }
.progress.on { display: block; }
.progress .now { font-weight: 600; }
.progress .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.meter { height: 6px; border-radius: 3px; background: var(--off-soft); margin-top: 10px; overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.cat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; user-select: none; }
.cat input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.cat .n { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.cat.on { border-color: var(--accent); background: var(--accent-soft); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.settings-foot { margin-top: 14px; justify-content: space-between; }
.hint { color: var(--muted); font-size: 13px; }
.filters { margin-bottom: 12px; }
.filters input[type=search] { flex: 1; min-width: 180px; }
.books { display: grid; }
.book { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.book:first-child { border-top: 0; }
.book img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--off-soft); }
.book .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.book .a { color: var(--muted); font-size: 14px; }
.book .acts { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-wait { background: var(--accent-soft); color: var(--accent); }
.b-off { background: var(--off-soft); color: var(--off); }
.tag { font-size: 12px; color: var(--muted); }
.book.dim .t, .book.dim img { opacity: .55; }
.count { color: var(--muted); font-size: 14px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
pre { margin: 12px 0 0; max-height: 340px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: var(--muted); }
.more { margin-top: 12px; text-align: center; }
@media (max-width: 640px) {
  .book { grid-template-columns: 40px 1fr; }
  .book img { width: 40px; height: 40px; }
  .book .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Archive yottio</h1>
    <span class="pill" id="pill">Chargement…</span>
    <button class="primary" id="runBtn">Lancer maintenant</button>
    <button id="stopBtn" hidden>Arrêter</button>
  </div>
</header>

<main>
  <section class="card progress" id="progress">
    <div class="now" id="pNow"></div>
    <div class="sub" id="pSub"></div>
    <div class="meter"><div id="pBar"></div></div>
  </section>

  <section class="card">
    <h2>Catégories téléchargées automatiquement</h2>
    <div class="cats" id="cats"></div>
    <div class="row settings-foot">
      <label class="row hint">Vérifier les nouveautés toutes les
        <input type="number" id="every" min="1" step="1" style="width:72px"> heures</label>
      <div class="row">
        <span class="hint" id="saved"></span>
        <button class="primary" id="saveBtn">Enregistrer</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Catalogue</h2>
    <div class="row filters">
      <input type="search" id="q" placeholder="Titre ou auteur">
      <select id="fCat"><option value="">Toutes les catégories</option></select>
      <select id="fState">
        <option value="">Tous les livres</option>
        <option value="selected">Retenus</option>
        <option value="complet">Archivés</option>
        <option value="todo">En attente</option>
        <option value="off">Ignorés</option>
      </select>
      <button id="refreshBtn" title="Recharger la liste des livres depuis Radio-Canada">Actualiser le catalogue</button>
    </div>
    <div class="count" id="count"></div>
    <div class="books" id="books"></div>
    <div class="more"><button id="moreBtn" hidden>Afficher plus</button></div>
  </section>

  <section class="card">
    <details id="logBox"><summary>Journal</summary><pre id="log"></pre></details>
  </section>

  <p class="hint" style="text-align:center;margin:4px 0 24px">
    Archive personnelle et privée seulement. Ne pas redistribuer.
    Projet non affilié à Radio-Canada ou yodio.ca.
  </p>
</main>

<script>
const $ = id => document.getElementById(id);
let books = [], cats = [], status = {}, shown = 60;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function catLabel(c) { return /^\d+-\d+ ans$/.test(c) ? "Jeunesse " + c : c; }
function fmtBytes(n) { return n > 1e9 ? (n / 1e9).toFixed(2) + " Go" : (n / 1e6).toFixed(0) + " Mo"; }
function fmtDate(s) { return s ? new Date(s).toLocaleString("fr-CA", {dateStyle: "medium", timeStyle: "short"}) : ""; }

function badge(b) {
  if (b.status === "complet") return '<span class="badge b-ok">Archivé</span>';
  if (b.status === "incomplet") return '<span class="badge b-warn">Incomplet</span>';
  if (status.progress && status.progress.id === b.id) return '<span class="badge b-wait">En cours</span>';
  if (b.selected) return '<span class="badge b-wait">En attente</span>';
  return '<span class="badge b-off">Ignoré</span>';
}

function renderCats() {
  $("cats").innerHTML = cats.map(c => `
    <label class="cat ${c.enabled ? "on" : ""}">
      <input type="checkbox" data-cat="${esc(c.name)}" ${c.enabled ? "checked" : ""}>
      <span>${esc(catLabel(c.name))}</span>
      <span class="n">${c.archived}/${c.count}</span>
    </label>`).join("");
  $("cats").querySelectorAll("input").forEach(i => i.onchange = () => {
    i.closest(".cat").classList.toggle("on", i.checked);
    $("saved").textContent = "Modifications non enregistrées";
  });
  const sel = $("fCat"), cur = sel.value;
  sel.innerHTML = '<option value="">Toutes les catégories</option>' +
    cats.map(c => `<option value="${esc(c.name)}">${esc(catLabel(c.name))}</option>`).join("");
  sel.value = cur;
}

function filtered() {
  const q = $("q").value.trim().toLowerCase(), cat = $("fCat").value, st = $("fState").value;
  return books.filter(b => {
    if (cat && b.category !== cat) return false;
    if (q && !(b.title + " " + b.author).toLowerCase().includes(q)) return false;
    if (st === "selected") return b.selected;
    if (st === "complet") return b.status === "complet";
    if (st === "todo") return b.selected && b.status !== "complet";
    if (st === "off") return !b.selected;
    return true;
  });
}

function renderBooks() {
  const list = filtered();
  $("count").textContent = `${list.length} livre(s)`;
  $("books").innerHTML = list.slice(0, shown).map(b => {
    const mode = b.forced ? "force" : b.skipped ? "skip" : "auto";
    return `<div class="book ${b.selected ? "" : "dim"}">
      <img loading="lazy" src="${esc(b.picture)}" alt="">
      <div style="min-width:0">
        <div class="t">${esc(b.title)}</div>
        <div class="a">${esc(b.author)} <span class="tag">· ${esc(catLabel(b.category))}</span></div>
      </div>
      <div class="acts">
        ${badge(b)}
        <select class="small" data-mode="${b.id}" title="Choix pour ce livre">
          <option value="auto" ${mode === "auto" ? "selected" : ""}>Selon la catégorie</option>
          <option value="force" ${mode === "force" ? "selected" : ""}>Toujours</option>
          <option value="skip" ${mode === "skip" ? "selected" : ""}>Jamais</option>
        </select>
        ${b.status === "complet" ? "" : `<button class="small" data-now="${b.id}">Archiver</button>`}
      </div>
    </div>`;
  }).join("");
  $("moreBtn").hidden = list.length <= shown;
  $("books").querySelectorAll("[data-mode]").forEach(s => s.onchange = async () => {
    await api("/api/book", {id: +s.dataset.mode, mode: s.value});
    loadBooks();
  });
  $("books").querySelectorAll("[data-now]").forEach(btn => btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Ajouté";
    await api("/api/run", {ids: [+btn.dataset.now]});
    pollStatus();
  });
}

async function loadBooks() {
  const d = await api("/api/books");
  books = d.books; cats = d.categories;
  renderCats(); renderBooks();
}

async function loadSettings() {
  const s = await api("/api/settings");
  $("every").value = s.every_hours;
}

let wasRunning = false;
async function pollStatus() {
  try { status = await api("/api/status"); } catch { $("pill").textContent = "Hors ligne"; return; }
  const p = status.progress || {}, run = status.running;
  $("pill").className = "pill" + (run ? " run" : "");
  $("pill").textContent = run ? "Archivage en cours"
    : status.next_run ? "Prochain passage : " + fmtDate(status.next_run) : "En veille";
  $("runBtn").hidden = run; $("stopBtn").hidden = !run;
  $("progress").classList.toggle("on", !!(run && p.book));
  if (run && p.book) {
    $("pNow").textContent = p.book;
    const track = p.tracks ? `Piste ${p.track}/${p.tracks} : ${p.track_title}` : "Préparation";
    const bytes = p.total_bytes ? ` · ${fmtBytes(p.bytes)} sur ${fmtBytes(p.total_bytes)}` : "";
    $("pSub").textContent = `Livre ${p.index} sur ${p.total} · ${track}${bytes}` + (status.queued ? ` · ${status.queued} en file` : "");
    $("pBar").style.width = p.total_bytes ? (100 * p.bytes / p.total_bytes).toFixed(1) + "%" : "0";
  }
  const pre = $("log"), atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  pre.textContent = status.log.join("\n");
  if (atBottom) pre.scrollTop = pre.scrollHeight;
  if (wasRunning && !run) loadBooks();
  wasRunning = run;
}

$("saveBtn").onclick = async () => {
  const boxes = [...$("cats").querySelectorAll("input")];
  const on = boxes.filter(b => b.checked).map(b => b.dataset.cat);
  const include = on.length === boxes.length ? [] : on;
  await api("/api/settings", {include, exclude: [], every_hours: +$("every").value || 24});
  $("saved").textContent = "Enregistré";
  await loadBooks();
};
$("runBtn").onclick = async () => {
  try { await api("/api/run", {}); } catch (e) { alert(e.message); }
  setTimeout(pollStatus, 800);
};
$("stopBtn").onclick = async () => {
  if (!confirm("Arrêter l'archivage ? Le livre en cours reprendra au prochain lancement.")) return;
  await api("/api/stop", {}); pollStatus();
};
$("refreshBtn").onclick = async () => {
  $("refreshBtn").disabled = true;
  try { await api("/api/refresh", {}); await loadBooks(); } catch (e) { alert(e.message); }
  $("refreshBtn").disabled = false;
};
$("moreBtn").onclick = () => { shown += 60; renderBooks(); };
["q", "fCat", "fState"].forEach(id => $(id).addEventListener("input", () => { shown = 60; renderBooks(); }));

loadSettings(); loadBooks(); pollStatus();
setInterval(pollStatus, 2000);
</script>
</body>
</html>
